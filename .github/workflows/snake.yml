name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake files in dist/
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AsahiRei
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563eb&color_dots=#eef2f8,#bfd3fb,#8db1f7,#4f8cff,#2563eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4f8cff&color_dots=#161b22,#16264a,#1f4a9e,#3a74e0,#7ea6ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
