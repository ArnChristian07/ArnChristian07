<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none">
<style>
  .display{font-family:'Space Grotesk','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
  
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#ffffff" stroke-opacity=".06"/></pattern>
  <radialGradient id="glow" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="1000" height="230" rx="24"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1000" height="230" fill="#111a2e"/>
  <rect width="1000" height="230" fill="url(#g)"/>
  <rect width="1000" height="230" fill="url(#glow)"/>
  <text x="56" y="70" class="mono" font-size="12" font-weight="500" letter-spacing="1.7" fill="#7ea6ff">05 — CONTACT</text>
  <text x="54" y="122" class="display" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#ffffff">Let’s build something<tspan fill="#7ea6ff">.</tspan></text>
  <text class="sans" font-size="15" fill="#94a0b4"><tspan x="56" y="164">Open to OJT placements, internships and freelance front-end work. Send a message and I usually reply within a day.</tspan></text>
</g>
<rect x=".5" y=".5" width="999" height="229" rx="23.5" stroke="#e4e8ef"/>
</svg>
